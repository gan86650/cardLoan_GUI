<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}借牌管理{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if request.session.get("admin") %}
  <header class="topbar">
    <a class="brand" href="/">🃏 借牌管理</a>
    <nav>
      <a href="/" class="{{ 'active' if request.url.path == '/' }}">借牌總覽</a>
      <a href="/loans/new" class="{{ 'active' if request.url.path == '/loans/new' }}">新增紀錄</a>
      <a href="/users" class="{{ 'active' if request.url.path.startswith('/users') }}">使用者</a>
      <a href="/history" class="{{ 'active' if request.url.path == '/history' }}">歸還紀錄</a>
    </nav>
    <form method="post" action="/logout"><button class="link">登出</button></form>
  </header>
  {% endif %}
  <main>
    {% for m in messages %}
      <div class="flash {{ m.kind }}">{{ m.message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
