{% extends "base.html" %}
{% from "_macros.html" import loan_option, user_options %}
{% block title %}轉借 · 借牌管理{% endblock %}
{% block content %}
<h1>🔁 轉借</h1>
<p class="muted">把借到的牌轉給另一個人：牌主不變，借貸關係從原借用人轉到新借用人。</p>

{% if loans %}
<form method="post" action="{{ action or '/transfer' }}" class="card stack"
      onsubmit="return confirm('確定要轉借嗎？')">
  <label>借牌紀錄
    <select name="loan_id" required>
      <option value="">請選擇</option>
      {% for l in loans %}{{ loan_option(l, selected) }}{% endfor %}
    </select>
  </label>
  <label>新借用人
    <select name="new_borrower_id" required>{{ user_options(users, "", "請選擇") }}</select>
  </label>
  <button>轉借</button>
</form>
{% else %}
  <p class="empty">目前沒有未還的紀錄</p>
{% endif %}
{% endblock %}
