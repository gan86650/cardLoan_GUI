{% extends "base.html" %}
{% from "_macros.html" import user_options, guild_field %}
{% block title %}批次紀錄 · 借牌管理{% endblock %}
{% block content %}
<h1>📦 批次紀錄</h1>
<p class="muted">同一個牌主借給同一個人多張牌，一次記錄。</p>

<form method="post" class="card stack">
  {{ guild_field(guilds, default_guild) }}
  <div class="row">
    <label>牌主（借出的人）
      <select name="lender_id" required>{{ user_options(users, "", "請選擇") }}</select>
    </label>
    <label>借用人（借走的人）
      <select name="borrower_id" required>{{ user_options(users, "", "請選擇") }}</select>
    </label>
  </div>
  <label>卡名列表
    <textarea name="cards" rows="6" required placeholder="一行一張，或用逗號分隔；加「x數量」指定張數&#10;例如：&#10;Robogon x2&#10;灰流麗 x3, 增殖的G"></textarea>
    <span class="hint">一次最多 20 筆，省略數量就是 1 張</span>
  </label>
  <div class="row">
    <label>版本（可選，套用到全部）
      <input name="edition" placeholder="例如 EN-001、Alpha">
    </label>
    <label>備註（可選，套用到全部）
      <input name="note">
    </label>
  </div>
  <button>新增全部</button>
</form>
{% endblock %}
