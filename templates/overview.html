{% extends "base.html" %}
{% from "_macros.html" import loan_table, user_options %}
{% block title %}借牌總覽 · 借牌管理{% endblock %}
{% block content %}
<h1>📋 借牌總覽 <span class="muted small">{{ loans | length }} 筆、共 {{ total_qty }} 張未還</span></h1>

<form method="get" class="filters card">
  {% if guilds | length > 1 %}
  <label>伺服器
    <select name="guild">
      <option value="">全部</option>
      {% for g in guilds %}<option value="{{ g }}" {{ 'selected' if g == filters.guild }}>{{ g }}</option>{% endfor %}
    </select>
  </label>
  {% endif %}
  <label>使用者（牌主或借用人）
    <select name="user">{{ user_options(users, filters.user, "全部") }}</select>
  </label>
  <label>卡名
    <input type="search" name="card" value="{{ filters.card }}" placeholder="關鍵字">
  </label>
  <div class="filter-actions">
    <button>篩選</button>
    <a href="/overview" class="button secondary">清除</a>
  </div>
</form>

{{ loan_table(loans) }}
{% endblock %}
