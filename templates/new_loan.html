{% extends "base.html" %}
{% from "_macros.html" import user_options %}
{% block title %}新增紀錄 · 借牌管理{% endblock %}
{% block content %}
<h1>新增借牌紀錄</h1>
<form method="post" class="card stack">
  {% if guilds | length > 1 %}
  <label>伺服器
    <select name="guild_id">
      {% for g in guilds %}<option value="{{ g }}" {{ 'selected' if g == default_guild }}>{{ g }}</option>{% endfor %}
    </select>
  </label>
  {% elif default_guild %}
  <input type="hidden" name="guild_id" value="{{ default_guild }}">
  {% else %}
  <label>伺服器 ID
    <input name="guild_id" required inputmode="numeric" placeholder="Discord 伺服器 ID">
  </label>
  {% endif %}

  <div class="row">
    <label>牌主（借出的人）
      <select name="lender_id" required>{{ user_options(users, "", "請選擇") }}</select>
    </label>
    <label>借用人（借走的人）
      <select name="borrower_id" required>{{ user_options(users, "", "請選擇") }}</select>
    </label>
  </div>

  <label>卡名
    <textarea name="cards" rows="5" required placeholder="一行一張，或用逗號分隔；加「x數量」指定張數&#10;例如：&#10;Robogon x2&#10;Ash Blossom"></textarea>
    <span class="hint">一次最多 20 筆，省略數量就是 1 張</span>
  </label>
  <div class="row">
    <label>版本（可選，套用到全部）
      <input name="edition" placeholder="例如 EN-001、Alpha">
    </label>
    <label>備註（可選，套用到全部）
      <input name="note">
    </label>
  </div>
  <p class="hint">名單裡沒有的人，請先到 <a href="/users">使用者</a> 頁新增。</p>
  <button>新增</button>
</form>
{% endblock %}
